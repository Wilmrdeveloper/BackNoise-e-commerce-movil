<div class="cart-header animate-in">
  <app-back-button fallbackRoute="/home"></app-back-button>
  <h1>Carrito</h1>
  <div class="spacer"></div>
</div>

<ion-content class="ion-padding cart-page">
  <ng-container *ngIf="(items$ | async) as items">

    <div class="cart-list animate-in delay-1" *ngIf="items.length > 0; else emptyCart">
      <div class="cart-item" *ngFor="let item of items">
        <div class="item-image">
          <img [src]="item.product.image" [alt]="item.product.name" />
        </div>
        <div class="item-info">
          <h2>{{ item.product.name }}</h2>
          <p>${{ item.product.price | number:'1.0-0' }}</p>
        </div>
        <div class="qty-control">
          <button (click)="decrease(item.product.id)">−</button>
          <span>{{ item.quantity }}</span>
          <button (click)="increase(item.product.id)">+</button>
        </div>
      </div>
    </div>

    <div class="cart-summary animate-in delay-2" *ngIf="items.length > 0">
      <div class="total-row">
        <span>Total</span>
        <h2>Total: ${{ getTotal() | number:'1.0-0' }}</h2>
      </div>
      <button class="checkout-btn" (click)="goToCheckout()">Ir a pagar</button>
    </div>

  </ng-container>

  <ng-template #emptyCart>
    <div class="empty-cart animate-in">
      <ion-icon name="cart-outline"></ion-icon>
      <p>Tu carrito está vacío</p>
      <button class="catalog-btn" routerLink="/home">Ver catálogo</button>
    </div>
  </ng-template>
</ion-content>
