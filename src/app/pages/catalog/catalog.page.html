<ion-header>
  <ion-toolbar color="dark">
    <ion-title>Catálogo</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/cart">
        <ion-icon name="cart-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="catalog-grid">
    <app-product-card *ngFor="let product of (products$ | async)" [product]="product" (addToCart)="onAddToCart($event)">
    </app-product-card>
  </div>
</ion-content>
