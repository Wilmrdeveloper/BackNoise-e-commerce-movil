<ion-content [fullscreen]="true" [scrollY]="false">
  <div class="register-page">

    <div class="top-section">
      <button class="back-button" (click)="goToLogin()" aria-label="Volver">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>

      <div class="brand">BlackNoise</div>
    </div>

    <div class="form-card">
      <h1>Crear cuenta</h1>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

        <div class="input-group">
          <label>Nombre</label>
          <ion-input type="text" formControlName="name" placeholder="Tu nombre" class="custom-input">
          </ion-input>
          <div class="error" *ngIf="name?.touched && name?.invalid">
            <span *ngIf="name?.errors?.['required']">El nombre es obligatorio</span>
            <span *ngIf="name?.errors?.['minlength']">Mínimo 2 caracteres</span>
          </div>
        </div>

        <div class="input-group">
          <label>Email</label>
          <ion-input type="email" formControlName="email" placeholder="tu@email.com" class="custom-input">
          </ion-input>
          <div class="error" *ngIf="email?.touched && email?.invalid">
            <span *ngIf="email?.errors?.['required']">El email es obligatorio</span>
            <span *ngIf="email?.errors?.['email']">Ingresa un email válido</span>
          </div>
        </div>

        <div class="input-group">
          <label>Contraseña</label>
          <ion-input type="password" formControlName="password" placeholder="••••••••" class="custom-input">
          </ion-input>
          <div class="error" *ngIf="password?.touched && password?.invalid">
            <span *ngIf="password?.errors?.['required']">La contraseña es obligatoria</span>
            <span *ngIf="password?.errors?.['minlength']">Mínimo 6 caracteres</span>
          </div>
        </div>

        <ion-button expand="block" type="submit" class="main-button">
          Registrarme
        </ion-button>
      </form>

      <div class="footer-link" (click)="goToLogin()">
        ¿Ya tienes cuenta? <strong>Inicia sesión</strong>
      </div>
    </div>

  </div>
</ion-content>
