<ion-card>
  <img [src]="product.image" [alt]="product.name" />
  <ion-card-header>
    <ion-card-title>{{ product.name }}</ion-card-title>
    <ion-card-subtitle>${{ product.price.toFixed(2) }}</ion-card-subtitle>
  </ion-card-header>
  <ion-card-content>
    <p *ngIf="product.description">{{ product.description }}</p>
    <ion-button expand="block" (click)="onAddToCart()">
      Agregar al carrito
    </ion-button>
  </ion-card-content>
</ion-card>
